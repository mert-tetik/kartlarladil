<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#090909" />
    <title>FoxiesDeck — Offline</title>
    <link rel="stylesheet" href="/offline-shell/card-design.css" />
    <style>
      @font-face {
        font-family: "Super Water";
        src: url("/offline-shell/super-water.ttf") format("truetype");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --brand: #f76808;
        --brand-pressed: #c94d00;
        --background: #090909;
        --surface: #121212;
        --surface-muted: #1a1a1a;
        --border: #262626;
        --text: #fafafa;
        --text-secondary: #a3a3a3;
        font-family: "Manrope", "Segoe UI", system-ui, sans-serif;
        background: var(--background);
        color: var(--text);
      }

      * { box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      body { margin: 0; background: var(--background); text-align: center; }
      button, input { font: inherit; }
      button { color: inherit; cursor: pointer; }
      button:focus-visible, input:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }

      .page {
        display: flex;
        width: min(100%, 620px);
        height: 100dvh;
        min-height: 0;
        flex-direction: column;
        margin: 0 auto;
        padding: env(safe-area-inset-top) 18px 0;
      }

      .page-content { min-height: 0; flex: 1 1 auto; overflow-y: auto; overscroll-behavior: contain; padding-bottom: 14px; scrollbar-color: #3b3b3b transparent; scrollbar-width: thin; }
      .hero { padding: 54px 0 20px; text-align: center; }
      h1 { margin: 0; font-size: clamp(27px, 7vw, 34px); font-weight: 700; line-height: 1.08; letter-spacing: -0.035em; }
      .super-water-locale h1, .super-water-locale .section-title, .super-water-locale .dialog-title, .super-water-locale .language-select-label, .super-water-locale .language-sheet-title { font-family: "Super Water", "Segoe UI", sans-serif; font-weight: 400; letter-spacing: 0; }

      .reconnect-dock { flex: 0 0 auto; padding: 12px 0 max(36px, calc(env(safe-area-inset-bottom) + 20px)); background: linear-gradient(180deg, rgb(9 9 9 / 0), var(--background) 28%); }
      .reconnect {
        display: flex;
        width: 100%;
        min-height: 49px;
        align-items: center;
        justify-content: center;
        gap: 9px;
        border: 0;
        border-bottom: 3px solid var(--brand-pressed);
        border-radius: 8px;
        color: #fff;
        background: var(--brand);
        font-size: 15px;
        font-weight: 700;
        transition: transform 120ms ease, filter 120ms ease;
      }
      .reconnect svg { width: 18px; height: 18px; }
      .reconnect:active { transform: translateY(2px); border-bottom-width: 1px; filter: brightness(.96); }
      .reconnect[disabled] { opacity: .72; cursor: wait; }
      .panel { margin-top: 16px; padding: 15px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); text-align: center; }
      .language-picker { position: relative; z-index: 10; display: grid; margin: 0 0 14px; text-align: left; }
      .language-select { display: flex; width: 100%; min-height: 56px; align-items: center; justify-content: space-between; gap: 12px; padding: 0 16px; border: 1px solid rgb(0 0 0 / 10%); border-radius: 12px; color: #111; background: #fff; font-size: 15px; font-weight: 700; text-align: left; transition: background-color 160ms ease; }
      .language-select:hover { background: #f1f5f9; }
      .language-select svg { width: 18px; height: 18px; flex: 0 0 auto; color: #64748b; }
      .language-select-leading { display: flex; min-width: 0; align-items: center; gap: 12px; }
      .language-select-label { flex: 0 0 auto; color: #64748b; font-size: 12px; font-weight: 700; }
      .language-flag { position: relative; display: inline-block; width: 36px; height: 24px; flex: 0 0 auto; overflow: visible; border-radius: 999px; font-size: 18px; line-height: 1; }
      .language-flag img { display: block; width: 100%; height: 100%; object-fit: contain; transform: scale(1.45); }
      .language-sheet { position: fixed; z-index: 1000; inset: 0; display: flex; align-items: flex-end; justify-content: center; visibility: hidden; pointer-events: none; }
      .language-sheet[data-open="true"], .language-sheet[data-closing="true"] { visibility: visible; }
      .language-sheet[data-open="true"] { pointer-events: auto; }
      .language-sheet-backdrop { position: absolute; inset: 0; border: 0; background: rgb(0 0 0 / 60%); }
      .language-sheet-panel { position: relative; z-index: 1; display: flex; width: 100%; max-height: 85dvh; flex-direction: column; overflow: visible; border-radius: 2rem 2rem 0 0; color: #fff; background: var(--brand); box-shadow: 0 1px 2px rgb(0 0 0 / 12%); transform: translateY(calc(100% + 80px)); transition: transform 360ms cubic-bezier(.85, 0, .15, 1); }
      .language-sheet[data-open="true"] .language-sheet-panel { transform: translateY(0); }
      .language-sheet-panel[data-dragging="true"] { transition: none; }
      .language-sheet-decoration { position: absolute; z-index: 0; inset: 0; overflow: hidden; border-radius: 2rem 2rem 0 0; opacity: .8; pointer-events: none; background-image: linear-gradient(to bottom, color-mix(in srgb, var(--brand) 92%, white) 0%, color-mix(in srgb, var(--brand) 97%, white) 24%, transparent 62%), radial-gradient(circle at 12% 25%, rgb(255 255 255 / .2) 0, rgb(255 255 255 / .08) 11%, transparent 28%), radial-gradient(circle at 88% 39%, rgb(255 255 255 / .16) 0, rgb(255 255 255 / .06) 12%, transparent 30%), radial-gradient(circle at 18% 67%, rgb(255 255 255 / .14) 0, rgb(255 255 255 / .05) 12%, transparent 27%), radial-gradient(circle at 82% 82%, rgb(255 255 255 / .15) 0, rgb(255 255 255 / .05) 11%, transparent 28%); }
      .language-sheet-drag-handle { position: relative; z-index: 0; display: flex; height: 3.5rem; flex-shrink: 0; align-items: flex-start; justify-content: center; touch-action: none; }
      .language-sheet-protrusion { position: absolute; z-index: 0; top: 0; left: 50%; aspect-ratio: 654 / 151; width: 390px; transform: translate3d(-50%, calc(-100% + 9px), 0) scale(.75); transform-origin: 50% 100%; }
      .language-sheet-protrusion-mask { position: absolute; inset: 0; background: color-mix(in srgb, var(--brand) 92%, white); mask-image: url('/missions/cikinti-v2.png'); -webkit-mask-image: url('/missions/cikinti-v2.png'); mask-position: center; -webkit-mask-position: center; mask-repeat: no-repeat; -webkit-mask-repeat: no-repeat; mask-size: 100% 100%; -webkit-mask-size: 100% 100%; }
      .language-sheet-protrusion-circle { position: absolute; top: 28%; left: 50%; width: 4rem; height: 4rem; border-radius: 999px; background: color-mix(in srgb, var(--brand) 62%, white); transform: translate3d(-50%, 8px, 0) scale(1.45); transform-origin: 50% 50%; }
      .language-sheet-protrusion-visual { position: absolute; top: 28%; left: 50%; display: flex; width: 4rem; height: 4rem; align-items: center; justify-content: center; transform: translate3d(-50%, 8px, 0); }
      .language-sheet-visual { width: 3.25rem; height: 3.25rem; flex: 0 0 auto; }
      .language-sheet-visual img { display: block; width: 100%; height: 100%; object-fit: contain; transform: scale(1.45); }
      .language-sheet-header { position: relative; z-index: 10; display: flex; flex-shrink: 0; align-items: center; justify-content: center; padding: 0 3.5rem .5rem; }
      .language-sheet-title { margin: 0; color: #fff; font-size: 30px; font-weight: 700; line-height: 1; text-align: center; }
      .language-sheet-close { position: absolute; top: -2.25rem; right: .5rem; display: grid; width: 3rem; height: 3rem; place-items: center; border: 0; border-radius: 999px; color: rgb(255 255 255 / .9); background: transparent; }
      .language-sheet-close svg { width: 1.75rem; height: 1.75rem; stroke-width: 3; }
      .language-options { position: relative; z-index: 10; display: grid; min-height: 0; flex: 1 1 auto; grid-template-columns: repeat(3, minmax(0, 1fr)); overflow-y: auto; overscroll-behavior: contain; gap: 12px 8px; padding: 1rem; scrollbar-color: rgb(255 255 255 / .35) transparent; scrollbar-width: thin; }
      .language-option { position: relative; display: flex; min-height: 9rem; width: 100%; flex-direction: column; align-items: center; justify-content: flex-start; gap: .375rem; border: 0; border-radius: 0; color: rgb(255 255 255 / .8); background: transparent; padding: .5rem .25rem .25rem; text-align: center; transition: transform 200ms ease; }
      .language-option:active { transform: scale(.95); }
      .language-option[aria-selected="true"] { color: #fff; }
      .language-option-leading { position: relative; display: inline-flex; width: 6rem; height: 6rem; flex: 0 0 auto; align-items: center; justify-content: center; }
      .language-option-flag { position: absolute; inset: 0; display: inline-flex; width: 6rem; height: 6rem; align-items: center; justify-content: center; }
      .language-option-flag img { display: block; width: 100%; height: 100%; object-fit: contain; }
      .language-option-outline { position: absolute; inset: -.375rem; opacity: 0; filter: brightness(0) invert(1); }
      .language-option[aria-selected="true"] .language-option-outline { opacity: 1; }
      .language-option-name { min-height: 2rem; max-width: 100%; padding: 0 .25rem; font-size: 16px; font-weight: 600; line-height: 1rem; overflow-wrap: anywhere; }
      .language-option[aria-selected="true"] .language-option-name { font-weight: 700; }
      .language-option:focus-visible { outline-offset: -3px; }
      .language-sheet-open .page-content { overflow: hidden; }
      .saved-cards-panel { margin-top: 46px; padding: 0; border: 0; border-radius: 0; background: transparent; }
      .notes-panel { margin-top: 46px; padding: 0; border: 0; border-radius: 0; background: transparent; transform: translateY(-10px); }
      .panel-heading { display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 7px; text-align: center; }
      h2 { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.3; }
      .saved-card-filter-row { display: flex; width: 100%; align-items: center; gap: 4px; margin: 0 auto 15px; padding: 4px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-muted); }
      .saved-card-filter { display: flex; min-height: 48px; min-width: 0; flex: 1 1 0; align-items: center; justify-content: center; gap: 8px; padding: 0 14px; border: 0; border-radius: 999px; color: var(--text-secondary); background: transparent; font-size: 16px; font-weight: 700; line-height: 1.15; transition: color 160ms ease, background-color 160ms ease, transform 120ms ease; }
      .saved-card-filter:hover { color: var(--text); background: #ffffff0c; }
      .saved-card-filter:active { transform: scale(.98); }
      .saved-card-filter[data-card-filter="active"][aria-pressed="true"] { color: #fff; background: #10b981; box-shadow: 0 1px 2px #0004; }
      .saved-card-filter[data-card-filter="learned"][aria-pressed="true"] { color: #fff; background: #0ea5e9; box-shadow: 0 1px 2px #0004; }
      .saved-card-filter-count { min-width: 1.25rem; color: currentColor; font-variant-numeric: tabular-nums; opacity: .72; }
      .saved-card-filter[aria-pressed="true"] .saved-card-filter-count { color: #fff; opacity: .9; }
      .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; gap: 11px; }
      .offline-card-item { display: flex; min-width: 0; flex-direction: column; gap: 8px; }
      .offline-card-design { width: 100%; aspect-ratio: 400 / 570; }
      .offline-card-progress { padding: 0 3px 2px; color: var(--text); }
      .offline-card-progress__label { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; font-weight: 700; line-height: 1.3; }
      .offline-card-progress__track { height: 8px; overflow: hidden; margin-top: 5px; border-radius: 99px; background: #ffffff45; }
      .offline-card-progress__fill { display: block; height: 100%; border-radius: inherit; background: #fff; }
      .empty { grid-column: 1 / -1; padding: 8px 0 2px; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }
      .empty { padding: 8px 0 2px; color: var(--text-secondary); font-size: 13px; line-height: 1.5; }

      .note-form { display: flex; gap: 8px; }
      .note-input { width: 100%; min-width: 0; height: 46px; padding: 0 12px; border: 2px solid #fff; border-radius: 8px; outline: none; color: var(--text); background: var(--background); font-size: 14px; text-align: left; }
      .note-input::placeholder { color: #737373; }
      .note-input:focus { border-color: #fff; }
      .note-input:focus-visible { outline: none; }
      .add-note { display: grid; width: 46px; height: 46px; flex: 0 0 auto; place-items: center; border: 0; border-bottom: 3px solid var(--brand-pressed); border-radius: 8px; color: #fff; background: var(--brand); }
      .add-note svg { width: 19px; height: 19px; }
      .notes-list { display: grid; gap: 6px; margin-top: 10px; }
      .notes-list:empty { margin-top: 0; }
      .note-row { display: flex; min-width: 0; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 10px; border-radius: 7px; color: #e5e5e5; background: var(--surface-muted); font-size: 13px; text-align: center; }
      .note-content { display: grid; min-width: 0; flex: 1; gap: 2px; text-align: left; }
      .note-language { color: var(--text-secondary); font-size: 11px; font-weight: 700; }
      .note-text { min-width: 0; overflow-wrap: anywhere; }
      .remove-note { display: grid; width: 30px; height: 30px; flex: 0 0 auto; place-items: center; border: 0; border-radius: 6px; color: var(--text-secondary); background: transparent; font-size: 18px; }
      .remove-note:hover { color: var(--text); background: #ffffff0c; }
      .offline-app-message-host { position: fixed; z-index: 2000; inset: 0 0 auto; display: flex; justify-content: center; padding: calc(12px + env(safe-area-inset-top)) 16px 0; pointer-events: none; }
      .offline-app-message { display: flex; width: 100%; max-width: 448px; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 12px; color: #fff; background: #dc2626; box-shadow: 0 1px 2px #0003; font-size: 14px; font-weight: 700; text-align: left; touch-action: pan-y; user-select: none; opacity: 0; transform: translate3d(var(--message-drag-offset, 0px), -20px, 0); transition: transform 420ms cubic-bezier(.85, 0, .15, 1), opacity 420ms cubic-bezier(.85, 0, .15, 1); pointer-events: auto; }
      .offline-app-message[data-app-message="success"] { background: #059669; }
      .offline-app-message[data-visible="true"] { opacity: 1; transform: translate3d(var(--message-drag-offset, 0px), 0, 0); }
      .offline-app-message[data-dragging="true"] { transition: none; }
      .offline-app-message[data-dismissing="true"] { opacity: 0; transform: translate3d(var(--message-dismiss-offset, 0px), 0, 0); }
      .offline-app-message svg { width: 20px; height: 20px; flex: 0 0 auto; }
      .offline-app-message-text { min-width: 0; flex: 1; }
      .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; clip-path: inset(50%); }

      @media (min-width: 540px) {
        .page { padding-right: 24px; padding-left: 24px; }
        .hero { padding-top: 60px; }
        .cards { gap: 14px; }
        .offline-card-progress__label { font-size: 14px; }
        .offline-card-progress__track { height: 9px; margin-top: 6px; }
        .modal { align-items: center; padding: 20px; }
        .dialog { max-height: min(82dvh, 760px); padding: 20px; border-radius: 12px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
      }
    </style>
  </head>
  <body data-offline-shell>
    <main class="page" id="offline-app">
      <div class="page-content" id="offline-content">
        <section class="hero" aria-labelledby="offline-title">
          <h1 id="offline-title"></h1>
        </section>

        <div class="language-picker" id="language-picker">
          <label class="sr-only" for="card-language-select" id="card-language-label"></label>
          <button class="language-select" id="card-language-select" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="card-language-sheet">
            <span class="language-select-leading">
              <span class="language-flag" id="card-language-current-flag" aria-hidden="true"></span>
              <span id="card-language-current"></span>
            </span>
            <span class="language-select-label" id="card-language-select-label" aria-hidden="true"></span>
          </button>
          <div class="language-sheet" id="card-language-sheet" aria-hidden="true" inert>
            <button class="language-sheet-backdrop" id="card-language-sheet-backdrop" type="button" aria-label="Close"></button>
            <section class="language-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="card-language-sheet-title">
              <div class="language-sheet-decoration" aria-hidden="true"></div>
              <div class="language-sheet-drag-handle" id="card-language-sheet-drag-handle">
                <span class="language-sheet-protrusion">
                  <span class="language-sheet-protrusion-mask"></span>
                  <span class="language-sheet-protrusion-circle"></span>
                  <span class="language-sheet-protrusion-visual">
                    <span class="language-sheet-visual" id="card-language-sheet-visual"></span>
                  </span>
                </span>
              </div>
              <div class="language-sheet-header">
                <h2 class="language-sheet-title" id="card-language-sheet-title"></h2>
                <button class="language-sheet-close" id="card-language-sheet-close" type="button" aria-label="Close">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
                </button>
              </div>
              <div class="language-options" id="card-language-options" role="listbox" aria-labelledby="card-language-sheet-title"></div>
            </section>
          </div>
        </div>

        <section class="panel notes-panel" aria-labelledby="notes-title">
          <div class="panel-heading"><h2 class="section-title" id="notes-title"></h2></div>
          <form class="note-form" id="note-form">
            <label class="sr-only" for="note-input" id="note-label"></label>
            <input class="note-input" id="note-input" maxlength="120" autocomplete="off" />
            <button class="add-note" id="add-note" type="submit" aria-label="Add note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          </form>
          <div class="notes-list" id="notes-list"></div>
        </section>

        <section class="panel saved-cards-panel" id="saved-cards-panel" aria-labelledby="deck-title">
          <div class="panel-heading"><h2 class="section-title" id="deck-title"></h2></div>
          <div class="saved-card-filter-row" id="saved-card-filter-row" role="group" aria-label="Saved card status">
            <button class="saved-card-filter" data-card-filter="active" type="button" aria-pressed="true">
              <span id="saved-card-filter-active-label"></span>
              <span class="saved-card-filter-count" id="saved-card-filter-active-count">0</span>
            </button>
            <button class="saved-card-filter" data-card-filter="learned" type="button" aria-pressed="false">
              <span id="saved-card-filter-learned-label"></span>
              <span class="saved-card-filter-count" id="saved-card-filter-learned-count">0</span>
            </button>
          </div>
          <div class="cards" id="saved-cards"></div>
        </section>
      </div>

      <div class="reconnect-dock" id="reconnect-dock">
        <button class="reconnect" id="reconnect" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7v5h-5"/><path d="M4 17v-5h5"/><path d="M5.6 9A7 7 0 0 1 17.2 6.5L20 12M4 12l2.8 5.5A7 7 0 0 0 18.4 15"/></svg>
          <span id="reconnect-label"></span>
        </button>
      </div>
    </main>
    <div class="offline-app-message-host" id="standalone-app-message-host" aria-live="polite"></div>

    <script src="/offline-shell/card-renderer.js" defer></script>
    <script src="/offline-shell/offline-shell.js" defer></script>
  </body>
</html>
